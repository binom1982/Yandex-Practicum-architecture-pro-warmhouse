# version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: smarthome
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -U anotheruser -d anotherdb" ]
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
        - smarthome-network

  temperature-api: 
    build: ./temperature-api
    container_name: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network

  sensor-service:
    build: ../services/sensor-service
    container_name: sensor-api
    ports:
      - "8082:8080"
    networks:
      - smarthome-network

  telemetry-service:
    build: ../services/telemetry-service
    container_name: telemetry-api
    ports:
      - "8083:8080"
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      sensor-service:
        condition: service_started
      telemetry-service:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - SENSOR_API_URL=http://sensor-api:8082
      - TELEMETRY_API_URL=http://sensor-api:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge