openapi: '3.0.3'
info:
  title: Smart Home API
  version: '1.0'
  description: API для взаимодействия микросервисов экосистемы «Тёплый дом»
servers:
  - url: http://localhost:8080/api/v1
paths:
  /devices/{id}:
    get:
      summary: Получить информацию об устройстве
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Устройство найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                DeviceExample:
                  summary: Пример ответа для GET /devices/{id}
                  value:
                    id: "123e4567-e89b-12d3-a456-426614174000"
                    name: "Датчик температуры Гостинная"
                    type: "Датчик температуры"
                    status: "on"
                    last_seen: "2026-01-02T12:00:00Z"
        '404':
          description: Устройство не найдено
      tags:
        - Device Management
    patch:
      summary: Обновить состояние устройства
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
            examples:
              UpdatedDeviceExample:
                summary: Пример обновлённого устройства после PATCH
                value:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  name: "Датчик температуры Гостинная"
                  type: "Датчик температуры"
                  status: "off"
                  last_seen: "2026-01-02T12:05:00Z"
              DeviceUpdateExample:
                summary: Пример тела запроса для PATCH /devices/{id}
                value:
                  status: "off"
      responses:
        '200':
          description: Состояние обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Некорректные данные
        '500':
          description: Внутренняя ошибка сервера
      tags:
        - Device Management
  /devices/{id}/command:
    post:
      summary: Отправить команду устройству
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
            examples:
              CommandExample:
                summary: Пример команды для POST /devices/{id}/command
                value:
                  command: "on"
                  payload: {}
      responses:
        '202':
          description: Команда принята в обработку
        '400':
          description: Некорректная команда
        '404':
          description: Устройство не найдено
      tags:
        - Device Management
  /telemetry:
    get:
      summary: Получить данные телеметрии
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Данные телеметрии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryRecord'
              examples:
                TelemetryExample:
                  summary: Пример массива данных телеметрии
                  value:
                    - timestamp: "2026-01-02T10:00:00Z"
                      metric: "temperature"
                      value: 22.5
                      unit: "°C"
                    - timestamp: "2026-01-02T10:05:00Z"
                      metric: "humidity"
                      value: 45.0
                      unit: "%"
        '400':
          description: Некорректные параметры
      tags:
        - Telemetry

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [on, off]
        last_seen:
          type: string
          format: date-time
    DeviceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [on, off]
    Command:
      type: object
      properties:
        command:
          type: string
          enum: [on, off]
        payload:
          type: object
    TelemetryRecord:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        metric:
          type: string
        value:
          type: number
        unit:
          type: string